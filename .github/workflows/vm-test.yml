name: Windows VM 6 Hours + Tailscale

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  vm:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Show Windows VM info
        shell: pwsh
        run: |
          Write-Host "=== GitHub Actions Windows Runner VM ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "CPU:"
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          Write-Host "RAM (GB):"
          [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "Disk:"
          Get-PSDrive C | Select-Object Used,Free

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --auth-key="$env:TS_AUTHKEY" --hostname="github-windows-${{ github.run_id }}"

          Start-Sleep -Seconds 5

          Write-Host "=== Tailscale IP ==="
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          Write-Host "=== Tailscale Status ==="
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Keep Windows VM running for up to 6 hours
        shell: pwsh
        run: |
          Write-Host "Windows runner VM + Tailscale is running..."
          for ($i = 1; $i -le 360; $i++) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] Runner alive - minute $i/360"
            Start-Sleep -Seconds 60
          }
