name: Windows VM 6 Hours + Tailscale + RDP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  vm:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Show Windows VM info
        shell: pwsh
        run: |
          Write-Host "=== GitHub Actions Windows Runner VM ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "CPU:"
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          Write-Host "RAM (GB):"
          [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "Disk:"
          Get-PSDrive C | Select-Object Used,Free

      - name: Performance cleanup and RDP optimization
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          # High-performance power plan.
          powercfg /setactive SCHEME_MIN

          # Disable non-essential background services only.
          $services = @(
            "DiagTrack",
            "dmwappushservice",
            "MapsBroker",
            "SysMain",
            "WSearch",
            "Fax",
            "RetailDemo"
          )
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Remove optional preinstalled AppX packages that are not needed for
          # development/RDP. Do not remove Windows shell, RDP, networking,
          # Tailscale, PowerShell, or developer/runtime components.
          $patterns = @(
            "*Xbox*",
            "*Solitaire*",
            "*BingNews*",
            "*BingWeather*",
            "*ZuneMusic*",
            "*ZuneVideo*",
            "*GetHelp*",
            "*Getstarted*",
            "*Microsoft.People*",
            "*Clipchamp*"
          )
          foreach ($pattern in $patterns) {
            Get-AppxPackage -AllUsers $pattern | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue
          }

          # Stop optional user-session processes when present.
          $processes = @(
            "OneDrive",
            "Teams",
            "ms-teams",
            "Widgets",
            "GameBar",
            "GameBarFTServer"
          )
          foreach ($proc in $processes) {
            Get-Process -Name $proc -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          # Disable visual effects that waste bandwidth/desktop rendering work.
          New-Item -Path "HKLM:SOFTWAREPoliciesMicrosoftWindows NTTerminal Services" -Force | Out-Null
          New-ItemProperty -Path "HKLM:SOFTWAREPoliciesMicrosoftWindows NTTerminal Services" -Name fDisableWallpaper -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path "HKLM:SOFTWAREPoliciesMicrosoftWindows NTTerminal Services" -Name fDisableFullWindowDrag -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path "HKLM:SOFTWAREPoliciesMicrosoftWindows NTTerminal Services" -Name fDisableMenuAnims -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path "HKLM:SOFTWAREPoliciesMicrosoftWindows NTTerminal Services" -Name fDisableCursorSetting -PropertyType DWord -Value 1 -Force | Out-Null

          # Disable transparency/animations for the current user.
          New-Item -Path "HKCU:SoftwareMicrosoftWindowsCurrentVersionThemesPersonalize" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:SoftwareMicrosoftWindowsCurrentVersionThemesPersonalize" -Name EnableTransparency -Value 0 -ErrorAction SilentlyContinue

          Write-Host "Performance cleanup and RDP optimization complete."

      - name: Configure RDP account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing GitHub Actions secret: RDP_PASSWORD"
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue
          if ($existing) {
            Set-LocalUser -Name "rdpuser" -Password $securePassword
          } else {
            New-LocalUser -Name "rdpuser" -Password $securePassword -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser" -ErrorAction SilentlyContinue

          Set-ItemProperty -Path "HKLM:SYSTEMCurrentControlSetControlTerminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP user: rdpuser"
          Write-Host "RDP is enabled."

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing GitHub Actions secret: TS_AUTHKEY"
          }

          $installer = "$env:TEMP	ailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

          & "$env:ProgramFilesTailscale	ailscale.exe" up --auth-key="$env:TS_AUTHKEY" --hostname="github-windows-${{ github.run_id }}"

          Start-Sleep -Seconds 5

          Write-Host "=== Tailscale IP ==="
          & "$env:ProgramFilesTailscale	ailscale.exe" ip -4

          Write-Host "=== Tailscale Status ==="
          & "$env:ProgramFilesTailscale	ailscale.exe" status

      - name: Keep Windows VM running for up to 6 hours
        shell: pwsh
        run: |
          Write-Host "Optimized Windows runner + Tailscale + RDP is running..."
          Write-Host "RDP username: rdpuser"
          for ($i = 1; $i -le 360; $i++) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] Runner alive - minute $i/360"
            Start-Sleep -Seconds 60
          }
