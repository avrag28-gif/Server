name: Windows VM 6 Hours + Tailscale + RDP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  vm:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Show Windows VM info
        shell: pwsh
        run: |
          Write-Host "=== GitHub Actions Windows Runner VM ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "CPU:"
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          Write-Host "RAM (GB):"
          [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, VideoModeDescription |
            Format-List
          Write-Host "Disk:"
          Get-PSDrive C | Select-Object Used,Free

      - name: Performance cleanup and RDP optimization
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          # Keep the VM at maximum AC performance and prevent idle sleep.
          powercfg /setactive SCHEME_MIN
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          # Disable only services that are unnecessary for this temporary
          # development/RDP session.
          $services = @(
            "DiagTrack",
            "dmwappushservice",
            "MapsBroker",
            "SysMain",
            "WSearch",
            "Fax",
            "RetailDemo"
          )
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Remove optional consumer AppX packages. Do not touch shell,
          # networking, PowerShell, RDP, or developer/runtime components.
          $patterns = @(
            "*Xbox*",
            "*Solitaire*",
            "*BingNews*",
            "*BingWeather*",
            "*ZuneMusic*",
            "*ZuneVideo*",
            "*GetHelp*",
            "*Getstarted*",
            "*Microsoft.People*",
            "*Clipchamp*"
          )
          foreach ($pattern in $patterns) {
            Get-AppxPackage -AllUsers $pattern |
              Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue
          }

          # Stop optional processes if present.
          $processes = @(
            "OneDrive",
            "Teams",
            "ms-teams",
            "Widgets",
            "GameBar",
            "GameBarFTServer"
          )
          foreach ($proc in $processes) {
            Get-Process -Name $proc -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          # Correct RDP policy paths.
          $rdpPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $rdpPolicy -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableWallpaper -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableFullWindowDrag -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableMenuAnims -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableCursorSetting -PropertyType DWord -Value 1 -Force | Out-Null

          # Disable Windows transparency/animation overhead.
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Path $personalize -Force | Out-Null
          New-ItemProperty -Path $personalize -Name EnableTransparency -PropertyType DWord -Value 0 -Force | Out-Null

          $visualEffects = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          New-Item -Path $visualEffects -Force | Out-Null
          New-ItemProperty -Path $visualEffects -Name VisualFXSetting -PropertyType DWord -Value 2 -Force | Out-Null

          Write-Host "Performance cleanup and RDP optimization complete."

      - name: Configure RDP account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing GitHub Actions secret: RDP_PASSWORD"
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue
          if ($existing) {
            Set-LocalUser -Name "rdpuser" -Password $securePassword
          } else {
            New-LocalUser -Name "rdpuser" -Password $securePassword -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser" -ErrorAction SilentlyContinue

          $terminalServer = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          Set-ItemProperty -Path $terminalServer -Name fDenyTSConnections -Value 0

          $rdpTcp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $rdpTcp -Name UserAuthentication -Value 1
          Set-ItemProperty -Path $rdpTcp -Name SecurityLayer -Value 1
          Set-ItemProperty -Path $rdpTcp -Name MinEncryptionLevel -Value 3

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP user: rdpuser"
          Write-Host "RDP is enabled."

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing GitHub Actions secret: TS_AUTHKEY"
          }

          $installer = Join-Path $env:TEMP "tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found at $tailscale"
          }

          & $tailscale up --auth-key="$env:TS_AUTHKEY" --hostname="github-windows-${{ github.run_id }}" --accept-dns=false

          Start-Sleep -Seconds 5

          Write-Host "=== Tailscale IP ==="
          & $tailscale ip -4

          Write-Host "=== Tailscale Status ==="
          & $tailscale status

      - name: Verify RDP and runtime state
        shell: pwsh
        run: |
          Write-Host "=== RDP service ==="
          Get-Service TermService | Select-Object Status,StartType,Name

          Write-Host "=== RDP listener ==="
          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue |
            Select-Object LocalAddress,LocalPort,State,OwningProcess

          Write-Host "=== CPU/RAM ==="
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          [pscustomobject]@{
            CPU = (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
            RAM_GB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)
            FreeRAM_GB = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          } | Format-List

      - name: Keep Windows VM running for up to 6 hours
        shell: pwsh
        run: |
          Write-Host "Optimized Windows runner + Tailscale + RDP is running..."
          Write-Host "RDP username: rdpuser"
          for ($i = 1; $i -le 360; $i++) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] Runner alive - minute $i/360"
            Start-Sleep -Seconds 60
          }
