name: VM 6 Hours

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Show VM info
        run: |
          echo "=== GitHub Actions Runner VM ==="
          uname -a
          echo "CPU: $(nproc)"
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /
          echo "OS:"
          cat /etc/os-release
      - name: Keep VM running for up to 6 hours
        run: |
          echo "VM is running..."
          for i in $(seq 1 360); do
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Runner alive - minute $i/360"
            sleep 60
          done
