name: Windows VM 6 Hours + Tailscale + RDP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  vm:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Show Windows VM info
        shell: pwsh
        run: |
          Write-Host "=== GitHub Actions Windows Runner VM ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "CPU:"
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          Write-Host "RAM (GB):"
          [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "Disk:"
          Get-PSDrive C | Select-Object Used,Free

      - name: Optimize Windows for RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          powercfg /setactive SCHEME_MIN

          $services = @("DiagTrack","dmwappushservice","MapsBroker","SysMain")
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          Stop-Service -Name "WSearch" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "WSearch" -StartupType Manual -ErrorAction SilentlyContinue

          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name fDisableWallpaper -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name fDisableFullWindowDrag -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name fDisableMenuAnims -PropertyType DWord -Value 1 -Force | Out-Null

          Write-Host "Windows RDP optimization complete."

      - name: Configure RDP account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing GitHub Actions secret: RDP_PASSWORD"
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue
          if ($existing) {
            Set-LocalUser -Name "rdpuser" -Password $securePassword
          } else {
            New-LocalUser -Name "rdpuser" -Password $securePassword -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser" -ErrorAction SilentlyContinue

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP user: rdpuser"
          Write-Host "RDP is enabled."

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing GitHub Actions secret: TS_AUTHKEY"
          }

          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --auth-key="$env:TS_AUTHKEY" --hostname="github-windows-${{ github.run_id }}"

          Start-Sleep -Seconds 5

          Write-Host "=== Tailscale IP ==="
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          Write-Host "=== Tailscale Status ==="
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Keep Windows VM running for up to 6 hours
        shell: pwsh
        run: |
          Write-Host "Windows runner + Tailscale + RDP is running..."
          Write-Host "RDP username: rdpuser"
          for ($i = 1; $i -le 360; $i++) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] Runner alive - minute $i/360"
            Start-Sleep -Seconds 60
          }
