name: Windows VM 6 Hours

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  vm:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Show Windows VM info
        shell: pwsh
        run: |
          Write-Host "=== GitHub Actions Windows Runner VM ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "CPU:"
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          Write-Host "RAM:"
          [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "Disk:"
          Get-PSDrive C | Select-Object Used,Free

      - name: Keep Windows VM running for up to 6 hours
        shell: pwsh
        run: |
          Write-Host "Windows runner VM is running..."
          for ($i = 1; $i -le 360; $i++) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] Runner alive - minute $i/360"
            Start-Sleep -Seconds 60
          }
